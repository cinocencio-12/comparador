<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparador de Compras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0F6B5C">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --line:#DDE3DA; --fg:#1A2420; --muted:#5E6B64;
  --accent:#0F6B5C; --accent-fg:#FFFFFF; --accent-soft:#E2F0EC;
  --tag:#F2B632; --tag-fg:#2B2000; --var:#E4E1F7; --var-fg:#2E2766;
  --danger:#B3361F; --danger-soft:#FBE7E2;
  --f-display:"Familjen Grotesk",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111816; --surface:#19221F; --line:#2B3833; --fg:#E7EEEA; --muted:#97A59E;
  --accent:#4FC2A8; --accent-fg:#06211B; --accent-soft:#163029;
  --var:#2C2850; --var-fg:#D9D4FF;
  --danger:#F08A73; --danger-soft:#3A1F19; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.summary div{background:var(--surface);padding:10px 12px;min-width:0}
.summary b{display:block;font-family:var(--f-mono);font-size:1.05rem;font-weight:600}
.summary span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font:600 .92rem var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.btn{font:600 .9rem var(--f-body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:5px 9px;font-size:.8rem}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger-soft);border-color:var(--danger)}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
.status.done{font-weight:400}
.status.err{background:var(--danger-soft)}
.product{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.product header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.product h3{margin:0;font:700 1.05rem var(--f-display);min-width:0;overflow-wrap:anywhere}
.offer{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;border-top:1px solid var(--line)}
.offer:first-of-type{border-top:0}
.offer.best{background:var(--accent-soft)}
.store{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.store a,.store span.n{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.chip{font:600 .68rem var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:999px;background:var(--tag);color:var(--tag-fg)}
.chip.code{background:transparent;border:1px dashed var(--muted);color:var(--fg);text-transform:none;letter-spacing:0;font-family:var(--f-mono)}
.chip.var{background:var(--var);color:var(--var-fg);text-transform:none;letter-spacing:0;font-size:.75rem}
.chip.warn{background:var(--danger-soft);color:var(--fg)}
.pname{grid-column:1/-1;font-size:.88rem;overflow-wrap:anywhere}
.refs{grid-column:1/-1;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.total{font:600 1.15rem var(--f-mono);text-align:right}
.break{grid-column:1/-1;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.notes{grid-column:1/-1;font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
details.desc{grid-column:1/-1;font-size:.88rem}
details.desc summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.82rem}
details.desc p{margin:6px 0 0;white-space:pre-line;overflow-wrap:anywhere}
.row-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.diff{font-size:.78rem;color:var(--muted);font-family:var(--f-mono);text-align:right}
.list{display:flex;flex-direction:column;gap:10px}
.gallery{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.gallery img{flex:none;width:88px;height:88px;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
.buyrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.buyrow .name{font-weight:600;overflow-wrap:anywhere}
.buyrow .meta{font-size:.84rem;color:var(--muted)}
.buyrow .who{display:flex;gap:10px;align-items:center;min-width:0}
.buyrow .pic{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none;cursor:zoom-in;background:#fff}
.grand{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border:2px solid var(--accent);border-radius:10px;background:var(--surface)}
.grand b{font:600 1.35rem var(--f-mono)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}
form.add,.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
form.add h2,.settings h2{grid-column:1/-1;margin:0;font:700 1.05rem var(--f-display)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f input,.f select,.f textarea{font:400 .95rem var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.f textarea{min-height:110px;resize:vertical}
.c6{grid-column:span 6}.c3{grid-column:span 3}.c2{grid-column:span 2}
.disc{display:flex;gap:6px}.disc select{width:70px;flex:none}
.full{grid-column:1/-1}
.imgedit{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.th .first{position:absolute;left:3px;bottom:3px;font:600 .6rem var(--f-body);background:rgba(0,0,0,.65);color:#fff;padding:1px 5px;border-radius:4px}
.addimg{width:84px;height:84px;border:1px dashed var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-weight:600;font-size:.8rem;color:var(--fg);padding:4px}
.lb{position:fixed;inset:0;background:rgba(8,12,10,.94);display:flex;align-items:center;justify-content:center;z-index:50;padding:56px 12px 64px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#fff}
.lb .bar{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:10px;align-items:center;color:#fff;font-family:var(--f-mono)}
.lb button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 .95rem var(--f-body);cursor:pointer}
.lb .close{position:absolute;top:14px;right:12px}
.picker{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.picker h2{margin:0;font:700 1.05rem var(--f-display)}
.pick{display:grid;grid-template-columns:auto 64px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.pick input{width:22px;height:22px;accent-color:var(--accent)}
.pick img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}
.pick .nm{font-weight:600;font-size:.9rem;overflow-wrap:anywhere;min-width:0}
.pick .vr{font-size:.8rem;color:var(--muted)}
.pick .pr{font:600 .95rem var(--f-mono)}
.pick.off{opacity:.55}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Comparador de Compras</h1>
    <p class="sub">En la tienda: Compartir → Comparador. Se guardan fotos, descripción, referencias y precio.</p>
  </div>

  <div id="status" class="status" hidden><span id="statusTxt"></span><button class="btn small" id="statusClose" type="button">Ok</button></div>

  <div class="status" id="photoBar" hidden><span id="photoTxt"></span><button class="btn small primary" id="photoGo" type="button">Buscar fotos</button></div>

  <div class="picker" id="picker" hidden>
    <h2 id="pickTitle">Elige qué guardar</h2>
    <div class="list" id="pickList"></div>
    <div class="actions">
      <button class="btn primary" type="button" id="pickSave">Guardar</button>
      <button class="btn" type="button" id="pickAll">Marcar todos</button>
      <button class="btn" type="button" id="pickCancel">Cancelar</button>
    </div>
  </div>

  <div class="summary">
    <div><b id="sProducts" class="num">0</b><span>Productos</span></div>
    <div><b id="sOffers" class="num">0</b><span>Ofertas</span></div>
    <div><b id="sTotal" class="num">0,00 €</b><span>Si compro lo mejor</span></div>
  </div>

  <div class="actions">
    <label class="btn primary" for="fShot">Añadir capturas</label>
    <input id="fShot" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
    <button class="btn" id="openForm" type="button">A mano / enlace</button>
    <button class="btn" id="openSettings" type="button">Ajustes</button>
  </div>

  <div class="settings" id="settings" hidden>
    <h2>Ajustes</h2>
    <div class="f c6"><label for="apiKey">Clave de API de Anthropic</label><input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off"></div>
    <div class="f c6"><label for="model">Modelo para leer webs (las capturas usan siempre Sonnet)</label>
      <select id="model">
        <option value="claude-haiku-4-5-20251001">Haiku 4.5 (rápido y barato)</option>
        <option value="claude-sonnet-5-5">Sonnet 5.5 (más preciso con variantes)</option>
      </select></div>
    <div class="actions full">
      <button class="btn primary" id="saveSettings" type="button">Guardar</button>
      <button class="btn" id="exportBtn" type="button">Copia de seguridad</button>
      <label class="btn" for="importFile">Restaurar copia</label><input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <p class="hint full" style="margin:0">La clave y la lista se guardan solo en este móvil.</p>
  </div>

  <form class="add" id="form" hidden autocomplete="off">
    <h2 id="formTitle">Nuevo</h2>
    <div class="f c6"><label for="fUrl">Enlace de la tienda</label><input id="fUrl" type="url" inputmode="url" placeholder="https://…"></div>
    <div class="actions full"><button class="btn small" type="button" id="readWeb">Leer datos y fotos de la web</button><span class="hint" id="readHint"></span></div>
    <div class="f c6"><label for="fProduct">Producto</label><input id="fProduct" required></div>
    <div class="f c3"><label for="fVariant">Variante / versión</label><input id="fVariant" placeholder="Full, Lite, Junior, 128 GB…"></div>
    <div class="f c3"><label for="fBrand">Marca</label><input id="fBrand"></div>
    <div class="f c6"><label for="fGroup">Comparar junto con</label><input id="fGroup" list="groupList" placeholder="Mismo nombre = se comparan juntos"><datalist id="groupList"></datalist></div>
    <div class="f c2"><label for="fSku">Ref. tienda / SKU</label><input id="fSku"></div>
    <div class="f c2"><label for="fMpn">Ref. fabricante</label><input id="fMpn"></div>
    <div class="f c2"><label for="fEan">EAN</label><input id="fEan" inputmode="numeric"></div>
    <div class="f c3"><label for="fStore">Tienda</label><input id="fStore"></div>
    <div class="f c3"><label for="fPrice">Precio €</label><input id="fPrice" inputmode="decimal" required></div>
    <div class="f c3"><label for="fDisc">Descuento</label><div class="disc"><input id="fDisc" inputmode="decimal" placeholder="0"><select id="fDiscType" aria-label="Tipo"><option value="eur">€</option><option value="pct">%</option></select></div></div>
    <div class="f c3"><label for="fCode">Cupón</label><input id="fCode"></div>
    <div class="f c3"><label for="fShip">Envío €</label><input id="fShip" inputmode="decimal" placeholder="0"></div>
    <div class="f c3"><label for="fFree">Envío gratis desde €</label><input id="fFree" inputmode="decimal"></div>
    <div class="f c6"><label for="fDesc">Descripción</label><textarea id="fDesc"></textarea></div>
    <div class="f c6"><label for="fNotes">Notas</label><input id="fNotes"></div>
    <div class="f c6"><label>Imágenes (la primera es la principal)</label>
      <div class="imgedit" id="imgEdit"><label class="addimg" for="fImgs">+ Fotos</label><input id="fImgs" type="file" accept="image/*" multiple hidden></div>
    </div>
    <div class="actions full">
      <button class="btn primary" type="submit">Guardar</button>
      <button class="btn" type="button" id="cancelBtn">Cancelar</button>
    </div>
  </form>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-compare" aria-selected="true">Comparar</button>
    <button role="tab" id="tab-buy" aria-selected="false">Listo para comprar</button>
    <button role="tab" id="tab-done" aria-selected="false">Comprados</button>
  </div>
  <section id="view"></section>
</div>

<div class="lb" id="lb" hidden role="dialog">
  <button class="close" id="lbClose" type="button">Cerrar</button>
  <img id="lbImg" alt="" referrerpolicy="no-referrer">
  <div class="bar"><button id="lbPrev" type="button">‹</button><span id="lbCount"></span><button id="lbNext" type="button">›</button></div>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const eur=n=>(Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  function num(v){
    if(typeof v==='number')return isFinite(v)?v:0;
    let s=String(v??'').replace(/[^\d.,-]/g,'');if(!s)return 0;
    const c=s.lastIndexOf(','),d=s.lastIndexOf('.');
    if(c>-1&&d>-1){s=c>d?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');}
    else if(c>-1)s=s.replace(',','.');
    const n=parseFloat(s);return isFinite(n)?n:0;
  }
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const clean=v=>String(v??'').trim();
  function hostOf(u){try{const h=new URL(u).hostname.replace(/^www\./,'');const p=h.split('.');const n=p.length>2&&p[p.length-2].length<=3?p[p.length-3]:p[p.length-2];return n?n.charAt(0).toUpperCase()+n.slice(1):h;}catch(e){return '';}}

  // ---------- IndexedDB ----------
  function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('comparador',1);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('items'))db.createObjectStore('items',{keyPath:'id'});if(!db.objectStoreNames.contains('inbox'))db.createObjectStore('inbox',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  async function tx(store,mode,fn){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(store,mode);const req=fn(t.objectStore(store));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);});}
  const getAll=s=>tx(s,'readonly',o=>o.getAll());
  const put=(s,v)=>tx(s,'readwrite',o=>o.put(v));
  const del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));

  let items=[],tab='compare',editingId=null;

  // ---------- imágenes (Blob guardado o URL de la tienda) ----------
  const blobUrls=new WeakMap();
  function src(v){if(typeof v==='string')return v;if(!blobUrls.has(v))blobUrls.set(v,URL.createObjectURL(v));return blobUrls.get(v);}
  const imgTag=(v,attrs)=>`<img src="${esc(src(v))}" alt="" loading="lazy" referrerpolicy="no-referrer" ${attrs||''}>`;
  async function grabImage(u){
    try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(u,{mode:'cors',signal:ctl.signal,referrerPolicy:'no-referrer'});clearTimeout(t);
      if(r.ok){const b=await r.blob();if(/^image\//.test(b.type)&&b.size>1500)return b;}}catch(e){}
    return u; // la tienda no deja copiarla: se muestra desde su web
  }
  async function grabImages(urls){
    const list=[...new Set((urls||[]).map(u=>clean(u).replace(/&amp;/g,'&')).filter(u=>/^https?:\/\//i.test(u)))].slice(0,8);
    return Promise.all(list.map(grabImage));
  }

  // ---------- cálculo y agrupación ----------
  function calc(it){const price=num(it.price),d=num(it.discount);const disc=it.discountType==='pct'?price*Math.min(d,100)/100:Math.min(d,price);const after=price-disc;const free=num(it.freeFrom);const ship=(free>0&&after>=free)?0:num(it.shipping);return{price,disc,after,ship,shipWaived:free>0&&after>=free&&num(it.shipping)>0,total:after+ship};}
  const fullName=it=>[clean(it.product),clean(it.variant)].filter(Boolean).join(' · ');
  const groupName=it=>clean(it.group)||fullName(it)||'Sin nombre';
  const key=s=>clean(s).toLowerCase().replace(/\s+/g,' ');
  function groups(status){const map=new Map();items.filter(i=>(i.status||'pending')===status).forEach(i=>{const k=key(groupName(i));if(!map.has(k))map.set(k,{name:groupName(i),offers:[]});map.get(k).offers.push(i);});const arr=[...map.values()];arr.forEach(g=>g.offers.sort((a,b)=>calc(a).total-calc(b).total));arr.sort((a,b)=>a.name.localeCompare(b.name,'es'));return arr;}
  // Busca con qué producto ya guardado comparar: mismo EAN o misma ref. de fabricante; si no, mismo nombre + variante.
  function autoGroup(doc){
    const ean=clean(doc.ean),mpn=key(doc.mpn);
    const m=items.find(i=>(ean&&clean(i.ean)===ean)||(mpn&&key(i.mpn)===mpn&&key(i.variant)===key(doc.variant)));
    return m?groupName(m):fullName(doc);
  }

  // ---------- render ----------
  function render(){
    const pend=groups('pending');
    $('#sProducts').textContent=pend.length;
    $('#sOffers').textContent=items.filter(i=>(i.status||'pending')==='pending').length;
    $('#sTotal').textContent=eur(pend.reduce((s,g)=>s+calc(g.offers[0]).total,0));
    $('#groupList').innerHTML=[...new Set(items.map(groupName))].map(p=>`<option value="${esc(p)}">`).join('');
    ['compare','buy','done'].forEach(t=>$('#tab-'+t).setAttribute('aria-selected',t===tab));
    const v=$('#view');
    v.innerHTML=tab==='compare'?renderCompare(pend):tab==='buy'?renderBuy(pend):renderDone();
  }
  const thumb=it=>(it.images||[]).length?imgTag(it.images[0],`class="pic" data-lb="${it.id}" data-i="0"`):'';
  function refsLine(it){const r=[];if(it.brand)r.push(esc(it.brand));if(it.sku)r.push('Ref. '+esc(it.sku));if(it.mpn)r.push('Fab. '+esc(it.mpn));if(it.ean)r.push('EAN '+esc(it.ean));return r.length?`<div class="refs">${r.map(x=>`<span>${x}</span>`).join('')}</div>`:'';}
  function offerRow(it,best,bestTotal,showName){
    const c=calc(it);const url=safeUrl(it.url);const store=esc(it.store||hostOf(it.url)||'Tienda');
    const discTxt=c.disc>0?`−${eur(c.disc)}${it.discountType==='pct'?` (${num(it.discount)}%)`:''}`:'sin dto.';

  // ---------- Claude ----------
  const FIELDS=`Responde SOLO con un objeto JSON, sin texto alrededor, con esta forma: {"products":[ ...un objeto por producto... ]}
Cada objeto de producto lleva estas claves:
{"product": nombre del producto SIN la variante (marca + modelo),

 "discountType": "pct" o "eur",
 "code": código de cupón si aparece, si no "",

 "images": lista de URLs absolutas de las fotos del producto (galería principal, en la mayor resolución disponible, máx. 8; nada de logos, iconos ni otros productos),
 "notes": una frase con otros datos útiles: precio anterior tachado, fin de la oferta, plazo de entrega, stock (p. ej. "Agotado"). "" si nada,
 "shot": (solo con capturas) índice empezando en 0 de la captura donde aparece este producto,
 "box": (solo con capturas) recuadro ajustado SOLO a la foto de este producto (sin el texto ni el precio) dentro de esa captura, como fracciones del ancho y alto [x0,y0,x1,y1] entre 0 y 1; [] si no se ve foto}
Usa punto decimal. Si un dato no aparece, no lo inventes. Devuelve SIEMPRE el JSON con lo que hayas encontrado, aunque falten datos; nunca respondas con una disculpa.`;
  const MULTI=`Puede ser la ficha de UN producto o un LISTADO con varios productos. Devuelve un objeto por cada producto distinto que tenga precio (máximo 12), en el orden en que aparecen.
Si dos productos tienen el nombre igual o cortado ("…"), NO los juntes: son distintos. En "variant" pon lo que los diferencia (lo que diga el nombre o, si no, lo que se ve en SU PROPIA foto: p. ej. "cañón corto, madera" frente a "cañón largo, negro"). Antes de escribir cada producto, mira su foto, su nombre y su precio, que estén en la misma tarjeta o columna, y no mezcles datos de tarjetas distintas.\n`;
  const SHOT_PROMPT=`Estas imágenes son capturas de pantalla del móvil de una tienda online (normalmente España, euros). Extrae los datos de compra. En "images" pon [] (las capturas ya se guardan). `+MULTI+FIELDS;
  const URL_PROMPT=u=>`Abre con web_fetch esta página de una tienda y extrae los datos de compra: ${u}\nSi es la ficha de un producto con varias versiones, usa la que corresponde a esta URL. Si es un listado, pon en "url" el enlace propio de cada producto y en "images" su foto. `+MULTI+FIELDS;

  function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob);});}
  // Para guardar: limita el ANCHO (una captura larga sigue siendo legible).
  async function shrink(file){try{const bmp=await createImageBitmap(file);const s=Math.min(1,1080/bmp.width,12000/bmp.height);const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));return b||file;}catch(e){return file;}}
  // Para enviar a Claude: corta las capturas muy alargadas en trozos legibles (alto ≈ 2 × ancho).
  async function slices(blob){
    try{
      const bmp=await createImageBitmap(blob);const W=bmp.width,H=bmp.height;
      if(H<=W*2.3)return [blob];
      const step=Math.round(W*2),ov=Math.round(W*0.15),out=[];
      for(let y=0;y<H&&out.length<8;y+=step-ov){
        const h=Math.min(step,H-y);if(h<W*0.3&&out.length)break;
        const cv=document.createElement('canvas');cv.width=W;cv.height=h;
        cv.getContext('2d').drawImage(bmp,0,y,W,h,0,0,W,h);
        out.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88)));
      }
      return out.filter(Boolean);
    }catch(e){return [blob];}
  }
  function parseJSON(t){try{return JSON.parse(t);}catch(e){}const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1]);}catch(e){}}const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}return null;}

  async function askClaude({images,url}){
    if(!cfg.key)throw new Error('falta la clave de API (ponla en Ajustes)');
    const content=[];
    for(const b of images||[])content.push({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:await toB64(b)}});
    const body={model:(images||[]).length?cfg.shotModel:cfg.model,max_tokens:4000,messages:[{role:'user',content}]};
    const headers={'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    if(url&&!(images||[]).length){
      content.push({type:'text',text:URL_PROMPT(url)});
      body.tools=[{type:'web_fetch_20250910',name:'web_fetch',max_uses:2}];
      headers['anthropic-beta']='web-fetch-2025-09-10';
    } else content.push({type:'text',text:SHOT_PROMPT+(url?`\nLa URL de la página es: ${url}`:'')});
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const m=(j.error&&j.error.message)||('error '+r.status);throw new Error(r.status===401?'la clave de API no es válida':m);}
    const fetchErr=(j.content||[]).find(c=>c.type==='web_fetch_tool_result'&&c.content&&c.content.type==='web_fetch_tool_result_error');
    const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
    const d=parseJSON(txt);
    let list=d&&Array.isArray(d.products)?d.products:Array.isArray(d)?d:(d&&typeof d==='object'?[d]:[]);
    list=list.filter(p=>p&&typeof p==='object'&&(p.product||p.price)).slice(0,12);
    if(!list.length){
      if(fetchErr)throw new Error('esta tienda no deja leer su web; comparte una captura');
      throw new Error('no se han encontrado datos del producto');
    }
    return list;
  }
  // Recorta la foto de un producto dentro de una captura (box en fracciones 0-1).
  async function cropBox(blob,box){
    try{
      if(!Array.isArray(box)||box.length!==4)return null;
      let [x0,y0,x1,y1]=box.map(Number);
      if(![x0,y0,x1,y1].every(v=>isFinite(v)))return null;
      if(x0>1||y0>1||x1>1||y1>1){return null;}
      x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(1,x1);y1=Math.min(1,y1);
      if(x1-x0<0.05||y1-y0<0.03)return null;
      const bmp=await createImageBitmap(blob);
      const pad=0.01,sx=Math.max(0,(x0-pad))*bmp.width,sy=Math.max(0,(y0-pad))*bmp.height;
      const sw=Math.min(bmp.width-sx,(x1-x0+2*pad)*bmp.width),sh=Math.min(bmp.height-sy,(y1-y0+2*pad)*bmp.height);
      const cv=document.createElement('canvas');cv.width=Math.round(sw);cv.height=Math.round(sh);
      cv.getContext('2d').drawImage(bmp,sx,sy,sw,sh,0,0,cv.width,cv.height);
      return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
    }catch(e){return null;}
  }

  const fixUrl=u=>{u=clean(u);if(!u)return '';if(/^https?:\/\//i.test(u))return u;return /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$)/i.test(u)?'https://'+u:'';};
  function fromClaude(d,fallbackUrl){
    const url=safeUrl(fixUrl(d.url))||safeUrl(fallbackUrl||'');
    const miss=[];if(!(num(d.price)>0))miss.push('precio');if(d.shipping===null||d.shipping===undefined)miss.push('envío');
    return{product:clean(d.product)||'Producto sin nombre',variant:clean(d.variant),brand:clean(d.brand),sku:clean(d.sku),mpn:clean(d.mpn),ean:clean(d.ean).replace(/\s/g,''),
      store:clean(d.store)||hostOf(url),url,price:num(d.price),discount:num(d.discount),discountType:d.discountType==='pct'?'pct':'eur',code:clean(d.code),
      shipping:num(d.shipping),freeFrom:num(d.freeFrom),description:clean(d.description),
      notes:[clean(d.notes),miss.length?`No visto: ${miss.join(', ')}.`:''].filter(Boolean).join(' '),incomplete:miss.length>0,imageUrls:Array.isArray(d.images)?d.images:[],
      shot:Number.isInteger(d.shot)?d.shot:0,box:d.box};
  }

  // Une lo leído en la web con lo leído en la captura: precio y variante de la captura; el resto, lo más completo.
  function mergeWeb(d,w){
    ['brand','sku','mpn','ean','store','code'].forEach(k=>{if(!d[k]&&w[k])d[k]=w[k];});
    if((w.description||'').length>(d.description||'').length)d.description=w.description;
    if(!(d.price>0)&&w.price>0){d.price=w.price;}
    if(d.shipping===0&&w.shipping>0)d.shipping=w.shipping;
    if(!d.freeFrom&&w.freeFrom)d.freeFrom=w.freeFrom;
    if(!d.variant&&w.variant)d.variant=w.variant;
    if(w.notes&&!d.notes.includes(w.notes))d.notes=[d.notes,w.notes].filter(Boolean).join(' ');
    d.imageUrls=[...w.imageUrls,...d.imageUrls];
    d.incomplete=!(d.price>0);
  }

  // Muestra los productos encontrados y deja elegir cuáles guardar. Resuelve con los elegidos ([] si cancela).
  function pickProducts(cands){
    return new Promise(resolve=>{
      const sel=new Set();
      const box=$('#pickList');
      const draw=()=>{
        box.innerHTML=cands.map((c,i)=>`<label class="pick ${sel.has(i)?'':'off'}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''}>
          ${(c.images||[]).length?imgTag(c.images[0]):'<span></span>'}
          <span class="nm">${esc(c.product)}${c.variant?`<div class="vr">${esc(c.variant)}</div>`:''}${c.notes?`<div class="vr">${esc(c.notes)}</div>`:''}</span>

        $('#pickSave').textContent=sel.size?`Guardar ${sel.size}`:'Guardar';$('#pickSave').disabled=!sel.size;
        $('#pickAll').textContent=sel.size===cands.length?'Desmarcar todos':'Marcar todos';
      };
      box.onchange=e=>{const i=+e.target.dataset.i;if(e.target.checked)sel.add(i);else sel.delete(i);draw();};
      $('#pickAll').onclick=()=>{if(sel.size===cands.length)sel.clear();else cands.forEach((c,i)=>sel.add(i));draw();};
      const done=v=>{$('#picker').hidden=true;box.onchange=null;resolve(v);};
      $('#pickSave').onclick=()=>done(cands.filter((c,i)=>sel.has(i)));
      $('#pickCancel').onclick=()=>done([]);
      $('#pickTitle').textContent=`He encontrado ${cands.length} productos. Marca los que quieras guardar:`;
      draw();$('#picker').hidden=false;$('#picker').scrollIntoView({behavior:'smooth',block:'start'});
    });
  }

  async function processShared(files,sharedUrl){
    const list=[...files].filter(f=>/^image\//.test(f.type)).slice(0,4);
    if(!list.length&&!sharedUrl)return;
    tab='compare';
    setStatus(list.length?`Leyendo ${list.length===1?'la captura':list.length+' capturas'}…`:'Leyendo la web del producto y sus fotos…','busy');
    const shots=[];for(const f of list)shots.push(await shrink(f));
    const parts=[];for(const b of shots)parts.push(...await slices(b));
    let doc;
    try{
      const found=await askClaude({images:parts.slice(0,10),url:sharedUrl});
      const single=found.length===1;
      setStatus(single?'Guardando las fotos del producto…':`Guardando ${found.length} productos y sus fotos…`,'busy');
      const cands=[];
      for(const raw of found){
        const d=fromClaude(raw,single?sharedUrl:(clean(raw.url)?'':sharedUrl));
        // Con captura de una sola ficha: abre también su web para traer descripción completa, fotos y referencias.
        if(single&&shots.length&&d.url&&!/amazon\./i.test(d.url)){
          setStatus('Abriendo la web del producto para traer descripción y fotos…','busy');
          try{const w=fromClaude((await askClaude({url:d.url}))[0],d.url);mergeWeb(d,w);}catch(e){}
          setStatus('Guardando las fotos del producto…','busy');
        }
        const webImgs=await grabImages(d.imageUrls);
        const part=parts[Math.min(Math.max(d.shot,0),parts.length-1)];
        const crop=part&&shots.length?await cropBox(part,d.box):null;
        const imgs=single?[...(crop&&!webImgs.length?[crop]:[]),...webImgs,...shots]:[...(crop?[crop]:[]),...webImgs,...(shots.length?[shots[0]]:[])];
        delete d.imageUrls;delete d.shot;delete d.box;
        cands.push({id:uid(),...d,images:imgs,status:'pending',createdAt:new Date().toISOString()});
      }
      let chosen=cands;
      if(!single){setStatus('');chosen=await pickProducts(cands);if(!chosen.length){setStatus('No se ha guardado nada.');return;}}
      const saved=[];
      for(const it of chosen){it.group=autoGroup(it);await put('items',it);items.push(it);saved.push(it);}
      render();
      if(single){const it=saved[0],c=calc(it),n=(it.images||[]).length;
        setStatus(`Guardado: ${fullName(it)} · ${eur(c.total)} · ${n} ${n===1?'foto':'fotos'}${it.incomplete?' (revisa: falta algún dato)':''}`);}
      else setStatus(`Guardados ${saved.length} ${saved.length===1?'producto':'productos'}: `+saved.map(it=>`${fullName(it)} (${eur(calc(it).total)})`).join(' · '));
      return;
    }catch(err){
      doc={id:uid(),product:'Sin leer · '+new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),variant:'',store:hostOf(sharedUrl||''),url:safeUrl(sharedUrl||''),price:0,discount:0,discountType:'eur',code:'',shipping:0,freeFrom:0,description:'',notes:'No se pudo leer: '+(err.message||err),images:shots,incomplete:true,status:'pending',createdAt:new Date().toISOString()};
      await put('items',doc);items.push(doc);render();setStatus('Guardado sin datos: '+(err.message||err)+'. Puedes editarlo.','err');return;
    }
  }

      box.insertBefore(d,add);});
  }
  $('#imgEdit').addEventListener('click',e=>{
    const rm=e.target.closest('[data-rm]');if(rm){formImgs.splice(+rm.dataset.rm,1);renderImgEdit();return;}
    const fi=e.target.closest('[data-first]');if(fi){const [x]=formImgs.splice(+fi.dataset.first,1);formImgs.unshift(x);renderImgEdit();}
  });
  F('fImgs').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';for(const f of fs)formImgs.push(await shrink(f));renderImgEdit();});
  function fillForm(it){
    FORM.forEach(([id,k])=>{const v=it[k];F(id).value=(k==='discountType')?(v||'eur'):(v===0&&['discount','shipping','freeFrom'].includes(k)?'':(v??''));});
    if(!it.group)F('fGroup').value=it.product?groupName(it):'';
  }
  function openForm(it){
    editingId=it?it.id:null;$('#formTitle').textContent=it?'Editar':'Nuevo';
    $('#form').reset();fillForm(it||{});formImgs=[...((it&&it.images)||[])];renderImgEdit();$('#readHint').textContent='';
    $('#form').hidden=false;$('#form').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function closeForm(){$('#form').hidden=true;editingId=null;formImgs=[];renderImgEdit();}
  $('#openForm').addEventListener('click',()=>openForm(null));
  $('#cancelBtn').addEventListener('click',closeForm);
  F('fUrl').addEventListener('input',()=>{if(!F('fStore').value)F('fStore').value=hostOf(F('fUrl').value);});
  $('#readWeb').addEventListener('click',async()=>{
    const u=safeUrl(F('fUrl').value.trim());if(!u){$('#readHint').textContent='Pega antes el enlace.';return;}
    const b=$('#readWeb');b.disabled=true;$('#readHint').textContent='Leyendo la web…';
    try{
      const d=fromClaude((await askClaude({url:u}))[0],u);delete d.shot;delete d.box;
      $('#readHint').textContent='Guardando fotos…';
      const imgs=await grabImages(d.imageUrls);delete d.imageUrls;
      const keepGroup=F('fGroup').value;fillForm(d);if(keepGroup)F('fGroup').value=keepGroup;
      formImgs=[...imgs,...formImgs.filter(v=>!imgs.includes(v))];renderImgEdit();
      $('#readHint').textContent=`Listo: ${imgs.length} fotos. Revisa la variante y pulsa Guardar.`;
    }catch(err){$('#readHint').textContent='No se pudo: '+(err.message||err);}
    finally{b.disabled=false;}
  });
  $('#form').addEventListener('submit',async e=>{
    e.preventDefault();
    const d={};FORM.forEach(([id,k])=>{d[k]=F(id).value.trim();});
    ['price','discount','shipping','freeFrom'].forEach(k=>d[k]=num(d[k]));
    d.url=safeUrl(d.url);d.ean=d.ean.replace(/\s/g,'');d.incomplete=false;
    if(!d.product)return;
    if(!d.group)d.group=fullName(d);
    if(editingId){const it=items.find(i=>i.id===editingId);Object.assign(it,d,{images:formImgs});await put('items',it);}
    else{const it={id:uid(),...d,images:formImgs,status:'pending',createdAt:new Date().toISOString()};await put('items',it);items.push(it);}
    closeForm();render();setStatus('Guardado.');
  });

  // ---------- acciones ----------
  let armed=null,armTimer=null;
  $('#view').addEventListener('click',async e=>{
    const b=e.target.closest('button[data-act]');if(!b)return;
    const it=items.find(i=>i.id===b.dataset.id);if(!it)return;
    const act=b.dataset.act;
    if(act==='edit')return openForm(it);
    if(act==='photos'){b.disabled=true;b.textContent='Buscando…';const ok=await fillPhotos(it);await scanPhotos();render();setStatus(ok?`Fotos añadidas: ${fullName(it)}`:`No he encontrado fotos para ${fullName(it)}. Añádelas desde Editar.`,ok?'':'err');return;}
    if(act==='del'){
      if(armed!==b){if(armed){armed.classList.remove('armed');armed.textContent='Borrar';}armed=b;b.classList.add('armed');b.textContent='¿Seguro? Pulsa otra vez';clearTimeout(armTimer);armTimer=setTimeout(()=>{b.classList.remove('armed');b.textContent='Borrar';armed=null;},4000);return;}
      armed=null;await del('items',it.id);items=items.filter(i=>i.id!==it.id);render();return;
    }
    if(act==='bought'){it.status='bought';it.boughtAt=new Date().toISOString();}
    if(act==='unbuy'){it.status='pending';it.boughtAt=null;}
    await put('items',it);render();
  });
  ['compare','buy','done'].forEach(t=>$('#tab-'+t).addEventListener('click',()=>{tab=t;render();}));

  // ---------- visor de fotos ----------
  let lbIt=null,lbI=0;
  function lbShow(){$('#lbImg').src=src(lbIt.images[lbI]);$('#lbCount').textContent=`${lbI+1} / ${lbIt.images.length}`;$('#lbPrev').hidden=$('#lbNext').hidden=lbIt.images.length<2;}
  $('#view').addEventListener('click',e=>{const t=e.target.closest('[data-lb]');if(!t)return;const it=items.find(i=>i.id===t.dataset.lb);if(!it||!(it.images||[]).length)return;lbIt=it;lbI=+t.dataset.i||0;$('#lb').hidden=false;lbShow();});
  $('#lbClose').addEventListener('click',()=>{$('#lb').hidden=true;});
  $('#lb').addEventListener('click',e=>{if(e.target.id==='lb')$('#lb').hidden=true;});
  $('#lbPrev').addEventListener('click',()=>{lbI=(lbI-1+lbIt.images.length)%lbIt.images.length;lbShow();});
  $('#lbNext').addEventListener('click',()=>{lbI=(lbI+1)%lbIt.images.length;lbShow();});
  let tx0=null;$('#lb').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});
  $('#lb').addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>40)(dx>0?$('#lbPrev'):$('#lbNext')).click();});

  // ---------- copia de seguridad ----------
  $('#exportBtn').addEventListener('click',async()=>{
    setStatus('Preparando la copia…','busy');
    const out=[];for(const it of items){const imgs=[];for(const b of it.images||[])imgs.push(typeof b==='string'?{url:b}:{type:b.type,data:await toB64(b)});out.push({...it,images:imgs});}
    const blob=new Blob([JSON.stringify({v:2,items:out})],{type:'application/json'});
    const file=new File([blob],'comparador-copia.json',{type:'application/json'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia Comparador'});setStatus('Copia compartida.');return;}}catch(e){}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='comparador-copia.json';a.click();setStatus('Copia descargada.');
  });
  $('#importFile').addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const j=JSON.parse(await f.text());for(const it of j.items||[]){it.images=(it.images||[]).map(im=>{if(im.url)return im.url;const bin=atob(im.data);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return new Blob([u8],{type:im.type||'image/jpeg'});});await put('items',it);}
      items=await getAll('items');render();setStatus('Copia restaurada.');}catch(err){setStatus('No se pudo restaurar: '+err.message,'err');}
  });

  // ---------- completar fotos de productos antiguos ----------
  // Un producto "no tiene foto" si no tiene imágenes o si todas son capturas de pantalla (más altas que anchas).
  const noPhoto=new Set();
  async function isShot(v){if(typeof v==='string')return false;try{const b=await createImageBitmap(v);return b.height>b.width*1.4;}catch(e){return false;}}
  async function scanPhotos(){
    noPhoto.clear();
    for(const it of items){const im=it.images||[];let lacks=!im.length;if(!lacks){lacks=true;for(const v of im){if(!(await isShot(v))){lacks=false;break;}}}if(lacks&&(it.url||im.length))noPhoto.add(it.id);}
    const n=noPhoto.size;$('#photoBar').hidden=!n||!cfg.key;
    $('#photoTxt').textContent=`${n} ${n===1?'producto no tiene':'productos no tienen'} foto del producto.`;
  }
  async function fillPhotos(it){
    const before=(it.images||[]).length;let added=[];
    try{
      if(safeUrl(it.url)&&!/amazon\./i.test(it.url)){
        const w=fromClaude((await askClaude({url:it.url}))[0],it.url);
        added=(await grabImages(w.imageUrls)).filter(v=>!(it.images||[]).includes(v));
        ['brand','sku','mpn','ean'].forEach(k=>{if(!it[k]&&w[k])it[k]=w[k];});
        if(!it.description&&w.description)it.description=w.description;
      }
      if(!added.length){
        const shot=(it.images||[]).find(v=>typeof v!=='string');
        if(shot){
          const parts=await slices(shot);
          const found=await askClaude({images:parts.slice(0,10)});
          const k=key(it.product);
          const p=found.find(f=>key(f.product)===k&&key(f.variant)===key(it.variant))||found.find(f=>key(f.product)===k)||found[0];
          const part=parts[Math.min(Math.max(Number.isInteger(p.shot)?p.shot:0,0),parts.length-1)];
          const crop=await cropBox(part,p.box);if(crop)added=[crop];
          if(!it.description&&p.description)it.description=clean(p.description);
        }
      }
    }catch(e){}
    if(!added.length)return false;
    it.images=[...added,...(it.images||[])];await put('items',it);return before!==it.images.length;
  }
  $('#photoGo').addEventListener('click',async()=>{
    const list=items.filter(i=>noPhoto.has(i.id));let ok=0,i=0;
    $('#photoBar').hidden=true;
    for(const it of list){i++;setStatus(`Buscando fotos ${i} de ${list.length}: ${fullName(it)}…`,'busy');if(await fillPhotos(it))ok++;render();}
    await scanPhotos();render();
    setStatus(`Listo: fotos añadidas a ${ok} de ${list.length} productos.${ok<list.length?' A los que faltan puedes añadirles fotos desde Editar.':''}`,ok?'':'err');
  });

  // ---------- arranque ----------
  (async()=>{
    items=await getAll('items').catch(()=>[]);render();
    if(!cfg.key){$('#settings').hidden=false;setStatus('Pega tu clave de API en Ajustes para que todo se lea solo.');}
    if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');}catch(e){}}
    await drainInbox();
    await scanPhotos();render();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)drainInbox();});
  })();
})();
</script>
</body>
</html>
